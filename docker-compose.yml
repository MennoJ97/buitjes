services:
  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    container_name: stratus-ingestor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FRAME_DIR: /data
    volumes:
      - frames:/data
    networks:
      - default

  weather-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stratus-weather-app
    restart: unless-stopped
    environment:
      FRAME_DIR: /data
    volumes:
      # Read-only: the ingestor owns this directory, the server only serves it.
      - frames:/data:ro
    depends_on:
      - ingestor
    # The frontend is baked into the image; no bind mount in production.
    # For local development use:
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.weatherapp.rule=Host(`weather.yourdomain.com`)" # Adjust to your domain
      - "traefik.http.routers.weatherapp.entrypoints=websecure"
      - "traefik.http.routers.weatherapp.tls=true"
      - "traefik.http.routers.weatherapp.tls.certresolver=myresolver" # Change to your Traefik cert resolver
      - "traefik.http.services.weatherapp.loadbalancer.server.port=3000"
    networks:
      - proxy
      - default

volumes:
  frames:

networks:
  proxy:
    external: true
  default: {}
