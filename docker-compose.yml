# Buitjes — the ingestor that publishes forecast frames, and the server that
# hands them to a browser.
#
# This file is what runs in production. Everything host-specific comes from
# `.env`, so the same file works on a laptop and on the server:
#
#   BUITJES_HOST          the hostname Traefik routes (weather.example.nl)
#   BUITJES_MIDDLEWARES   the router's middleware chain, in order
#
# Local development, which adds the published port and bind-mounts the frontend:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# TLS is assumed to be configured on the `websecure` entrypoint (a wildcard cert
# covering BUITJES_HOST). A Traefik that issues per-router certificates instead
# needs `traefik.http.routers.buitjes.tls.certresolver=<resolver>` added below.

# The Compose project name. Without it the project is named after the directory
# this file sits in, which is still WeatherApp — so the built images, the volume
# and the default network would all read `weatherapp` while the containers read
# `buitjes`.
name: buitjes

services:
  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    container_name: buitjes-ingestor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FRAME_DIR: /data
      # Load-bearing, not cosmetic. Alert bodies say "starting around 14:05",
      # and that clock comes from `datetime.fromtimestamp` — the container's
      # local time. Without TZ the image is UTC, so every summer alert names a
      # time two hours in the past and reads as a stale notification.
      # A bind-mounted /etc/localtime would NOT fix this on its own.
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - frames:/data
    # One cycle holds all 20 members of a single 5-minute step at once
    # (20 x 780 x 780 float32), then drops them; the arrays never stack up
    # across steps. The exception is a step KNMI published without an ensemble
    # behind it, which briefly holds three - the steps either side and the
    # average standing in for it - about once a cycle. Measured peak is ~330 MB
    # for a clean cycle and ~380 MB for one carrying a repair, both including
    # the page cache from the HDF5 reads. That is 1.3x headroom on the worse of
    # the two, and not a target to run against.
    mem_limit: 512m
    networks:
      # `proxy` is here only so alerts can reach ntfy by container name
      # (ALERT_WEBHOOK_URL=http://ntfy/<topic>). Going out to the public
      # hostname instead would send the alert through the reverse proxy and
      # its WAF, which inspects JSON bodies — a job that notifies itself into
      # an IP ban is a bad way to learn it is raining.
      - default
      - proxy

  weather-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: buitjes-weather-app
    restart: unless-stopped
    environment:
      FRAME_DIR: /data
      TZ: ${TZ:-Europe/Amsterdam}
      # Comma-separated origins allowed to call the API cross-origin. Unset
      # means same-origin only. A homepage widget that renders server-side —
      # the dashboard fetching this container over the Docker network — makes
      # no browser request here and needs nothing set.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Comma-separated keys for the widget endpoints. Empty leaves them open,
      # which is the right answer when the router in front requires a login:
      # the only clients that can reach the port are already trusted.
      API_KEYS: ${API_KEYS:-}
      API_KEY_PROTECTED_PREFIXES: ${API_KEY_PROTECTED_PREFIXES:-/api/point,/api/current}
    volumes:
      # Read-only: the ingestor owns this directory, the server only serves it.
      - frames:/data:ro
    depends_on:
      - ingestor
    # Serving files and slicing JSON. Measured peak is 16 MB; the limit is here
    # so a leak shows up as a restart rather than as swap on a busy host.
    mem_limit: 128m
    # No published port: reaching this container should mean going through the
    # proxy, where the middleware chain below applies. The dev overlay adds one.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.buitjes.rule=Host(`${BUITJES_HOST:-weather.example.com}`)"
      - "traefik.http.routers.buitjes.entrypoints=websecure"
      - "traefik.http.routers.buitjes.tls=true"
      - "traefik.http.services.buitjes.loadbalancer.server.port=3000"
      # Rate limiting lives here rather than in the app: it runs before a
      # request reaches the container, and it protects the static frontend and
      # the frame downloads too, which are the bandwidth-heavy part.
      # average = sustained requests/second per client IP, burst = allowance.
      # A map page load fetches ~85 frames at once, hence the generous burst.
      - "traefik.http.middlewares.buitjes-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.buitjes-ratelimit.ratelimit.burst=240"
      - "traefik.http.middlewares.buitjes-ratelimit.ratelimit.period=1s"
      # "per client IP" is only true because of this line. Traefik's default
      # sourceCriterion is the DIRECT PEER's address, and behind a tunnel that
      # peer is the tunnel daemon — so without it every internet visitor shares
      # ONE bucket and two simultaneous map loads 429 each other. depth=1 takes
      # the right-most X-Forwarded-For entry, which is the one the CDN appends
      # itself, so a client cannot spoof it by sending its own XFF. Do NOT raise
      # depth: entry 2 from the right is attacker-controlled. This needs the
      # entrypoint to trust XFF from the proxy network
      # (`forwardedHeaders.trustedIPs`), which is what makes the header present
      # and reliable here at all.
      - "traefik.http.middlewares.buitjes-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # ^ has a cost on the LAN: if split-horizon DNS points BUITJES_HOST at the
      # server directly, those requests reach Traefik with NO X-Forwarded-For at
      # all — depth=1 then yields an empty client IP and every internal device
      # shares a single bucket. They also miss the CDN edge cache, so an
      # internal map load is ~85 origin requests where a public one is mostly
      # cache hits. That is why burst is 240 above and not the 120 it once was:
      # two internal devices loading the map at once must not 429 each other.

      # /api/conditions is the only endpoint that makes this server call someone
      # else's API, and it is deliberately not behind API_KEYS because the map
      # needs it for click-anywhere. So it gets its own router and a limit an
      # order of magnitude tighter than the rest of the site: a person clicking
      # around produces a click every second or two, while a coordinate sweep
      # produces thousands. The in-process budget in serve_conditions is the
      # second half of this — that one caps the total across all callers, which
      # is the number the upstream free tier actually counts.
      - "traefik.http.middlewares.buitjes-conditions-ratelimit.ratelimit.average=2"
      # Burst 30 rather than the 10 this started at, for the same reason the
      # site-wide burst is 240: the depth=1 strategy below yields an empty
      # client IP for a request that arrives with no X-Forwarded-For, so every
      # LAN and WireGuard device shares one bucket. At 10 that was shallow
      # enough for two people clicking around the map at once to 429 each other.
      - "traefik.http.middlewares.buitjes-conditions-ratelimit.ratelimit.burst=30"
      - "traefik.http.middlewares.buitjes-conditions-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.buitjes-conditions-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Traefik ranks routers by rule length, so this one wins over the Host-only
      # router above without needing an explicit priority. It reuses that
      # router's service rather than declaring a second one.
      - "traefik.http.routers.buitjes-conditions.rule=Host(`${BUITJES_HOST:-weather.example.com}`) && PathPrefix(`/api/conditions`)"
      - "traefik.http.routers.buitjes-conditions.entrypoints=websecure"
      - "traefik.http.routers.buitjes-conditions.tls=true"
      - "traefik.http.routers.buitjes-conditions.service=buitjes"
      # Headers this stack needs on top of whatever shared chain is configured.
      # Kept here rather than added to a shared `sec-headers` middleware because
      # the policy below names *this* app's tile providers; another service
      # borrowing that middleware should not inherit them.
      #
      # frameDeny sends X-Frame-Options: DENY, which frame-ancestors already
      # covers for current browsers. Nothing embeds this page - the dashboard
      # widget renders server-side against the container name and the homepage
      # only links to it - so denying outright costs nothing.
      - "traefik.http.middlewares.buitjes-headers.headers.frameDeny=true"
      # The map is the whole reason this policy is not just default-src 'self':
      #   - MapLibre builds its workers from blob: URLs, so worker-src blob: is
      #     load-bearing; without it the map renders nothing at all.
      #   - the two tile origins are the only external hosts the page loads.
      #     Every other URL in the markup is an attribution link, not a fetch.
      #   - raster tiles arrive as images and vector tiles/style/glyphs over
      #     fetch, hence the origins appearing under both img-src and
      #     connect-src.
      # There are no inline scripts or styles in the pages, so neither
      # 'unsafe-inline' nor a hash list is needed - keep it that way.
      - "traefik.http.middlewares.buitjes-headers.headers.contentSecurityPolicy=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org https://tile.openstreetmap.org; connect-src 'self' https://tiles.openfreemap.org https://tile.openstreetmap.org; font-src 'self' https://tiles.openfreemap.org; worker-src blob:; child-src blob:"

      # Order matters and the list replaces rather than appends, so an auth
      # middleware has to be named here explicitly — see .env.example.
      # buitjes-headers is appended rather than left to that variable so the
      # policy travels with the stack that the policy describes.
      - "traefik.http.routers.buitjes.middlewares=${BUITJES_MIDDLEWARES:-buitjes-ratelimit@docker},buitjes-headers@docker"
      # The conditions router carries the same chain plus its own limit, so a
      # click still counts against the site-wide bucket as well as this one.
      - "traefik.http.routers.buitjes-conditions.middlewares=${BUITJES_MIDDLEWARES:-buitjes-ratelimit@docker},buitjes-conditions-ratelimit@docker,buitjes-headers@docker"
    networks:
      - proxy
      - default

volumes:
  # Deliberately a named volume rather than a directory under the backup root:
  # every frame in here is re-fetched from KNMI within one cycle, and the point
  # documents are rewritten each cycle too. Nothing in it is worth restoring.
  frames:

networks:
  proxy:
    external: true
  default: {}
